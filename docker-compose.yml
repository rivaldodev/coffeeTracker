version: '3.8'

services:
  coffee-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - BACKEND_URL=http://api:8080
    expose:
      - "80"
    restart: always
    networks:
      - coolify
    labels:
      - "coolify.managed=true"

networks:
  coolify:
    external: true
